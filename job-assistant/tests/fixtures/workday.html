<!doctype html><html><body>
<h2>My Information</h2>
<div data-automation-id="legalNameSection">
  <div id="lbl-fn">Given Name(s)</div><input data-automation-id="legalNameSection_firstName" aria-labelledby="lbl-fn">
  <div id="lbl-ln">Family Name</div><input data-automation-id="legalNameSection_lastName" aria-labelledby="lbl-ln">
</div>
<div id="lbl-a1">Address Line 1</div><input data-automation-id="addressSection_addressLine1" aria-labelledby="lbl-a1">
<div id="lbl-city">City</div><input data-automation-id="addressSection_city" aria-labelledby="lbl-city">
<label for="st">State</label><select id="st"><option value="">Select One</option><option value="FL">Florida</option><option value="GA">Georgia</option></select>
<div id="lbl-zip">Postal Code</div><input data-automation-id="addressSection_postalCode" aria-labelledby="lbl-zip">
<label for="ptype">Phone Device Type</label><select id="ptype"><option value="">Select One</option><option>Mobile</option></select>
<div id="lbl-ph">Phone Number</div><input type="tel" data-automation-id="phone-number" aria-labelledby="lbl-ph">
<div id="lbl-how">How Did You Hear About Us?</div><input data-automation-id="sourcePrompt" aria-labelledby="lbl-how">
<label for="prev">Have you previously worked for this company?</label><input id="prev">
</body></html>
