<!doctype html>
<html><head><title>Apply — Product Manager</title></head>
<body>
<h1>Product Manager</h1>
<p>We value security checks in our release process and experience with automated testing tools.</p>
<form id="app" action="/submitted" method="post">
  <label for="fn">First Name</label><input id="fn" name="first_name">
  <label for="ln">Last Name</label><input id="ln" name="last_name">
  <label for="em">Email</label><input id="em" type="email" name="email">
  <label for="ph">Phone</label><input id="ph" type="tel" name="phone">
  <label for="li">LinkedIn Profile</label><input id="li" name="urls[LinkedIn]">
  <label for="city">City</label><input id="city" name="city" value="Typed by Bruno">
  <label for="country">Country</label>
  <select id="country" name="country"><option value="">Select…</option><option value="US">United States</option><option value="CA">Canada</option></select>
  <label for="cv">Resume/CV</label><input id="cv" type="file" name="resume">
  <label for="cl">Cover Letter</label><input id="cl" type="file" name="cover_letter">
  <label for="why">Why do you want to work here?</label><textarea id="why" name="why"></textarea>
  <label for="sal">Desired salary</label><input id="sal" name="salary">
  <label for="gender">Gender</label><select id="gender" name="gender"><option value="">Select…</option><option>Decline to self-identify</option></select>
  <fieldset><legend>Are you legally authorized to work in the United States?</legend>
    <label><input type="radio" name="auth" value="yes"> Yes</label><label><input type="radio" name="auth" value="no"> No</label></fieldset>
  <label><input type="checkbox" id="consent" name="consent"> I agree to the privacy policy</label>
  <button type="submit" id="submit">Submit application</button>
</form>
<div class="grecaptcha-badge" style="width:256px;height:60px;position:fixed;bottom:0;right:0"><iframe title="reCAPTCHA" src="about:blank#recaptcha-anchor" width="256" height="60"></iframe></div>
<script>
  window.__submitted = 0;
  document.getElementById('app').addEventListener('submit', (e) => { e.preventDefault(); window.__submitted++; });
</script>
</body></html>
