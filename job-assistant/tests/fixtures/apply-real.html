<!doctype html>
<html><head><title>Account Executive, SMB - Acme Security</title></head>
<body>
<h1>Apply: Account Executive, SMB</h1>
<form action="/thanks" method="get">
  <label for="fn">First Name</label><input id="fn" name="first_name">
  <label for="ln">Last Name</label><input id="ln" name="last_name">
  <label for="em">Email</label><input id="em" type="email" name="email">
  <label for="cv">Resume/CV</label><input id="cv" type="file" name="resume">
  <fieldset><legend>Are you legally authorized to work in the United States?</legend>
    <label><input type="radio" name="auth" value="1"> Yes</label><label><input type="radio" name="auth" value="0"> No</label></fieldset>
  <label for="sp">Will you now or in the future require visa sponsorship?</label>
  <select id="sp" name="sp"><option value="">Select…</option><option value="y">Yes</option><option value="n">No</option></select>
  <label for="sal">What are your salary expectations?</label><input id="sal" name="sal">
  <label for="vet">Veteran status</label><select id="vet" name="vet"><option value="">Select…</option><option>I am not a protected veteran</option></select>
  <button type="submit" id="submit">Submit application</button>
</form>
</body></html>
