<!doctype html>
<html><head><title>Job Application for Account Executive, SMB at Acme Security</title></head>
<body>
<h1>Account Executive, SMB</h1>
<p>Acme Security · Remote</p>
<form id="application" action="confirmation" method="get">
  <label for="first_name">First Name *</label><input id="first_name" name="first_name" required>
  <label for="last_name">Last Name *</label><input id="last_name" name="last_name" required>
  <label for="email">Email *</label><input id="email" name="email" type="email" required>
  <label for="phone">Phone</label><input id="phone" name="phone" type="tel">
  <label for="resume">Resume/CV *</label><input id="resume" name="resume" type="file" required>
  <label for="linkedin">LinkedIn Profile</label><input id="linkedin" name="linkedin">
  <label for="auth">Are you legally authorized to work in the United States? *</label>
  <select id="auth" name="auth" required><option value="">Select...</option><option value="1">Yes</option><option value="0">No</option></select>
  <fieldset><legend>Will you now or in the future require visa sponsorship? *</legend>
    <label><input type="radio" name="sponsor" value="yes" required> Yes</label>
    <label><input type="radio" name="sponsor" value="no"> No</label></fieldset>
  <label for="hear">How did you hear about us?</label><input id="hear" name="hear">
  <label for="gender">Gender</label><select id="gender" name="gender"><option value="">Select...</option><option>Decline to self-identify</option></select>
  <label for="veteran">Veteran status</label><select id="veteran" name="veteran"><option value="">Select...</option><option>I am not a protected veteran</option></select>
  <!--EXTRA-->
  <label><input type="checkbox" id="privacy" name="privacy" required> I have read and agree to the Applicant Privacy Notice</label>
  <button type="submit" id="submit_app">Submit application</button>
</form>
</body></html>
